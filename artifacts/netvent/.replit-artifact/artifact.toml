kind = "web"
previewPath = "/"
title = "NetVent Parivaar"
version = "1.0.0"
id = "artifacts/netvent"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23020

[services.development]
run = "pnpm --filter @workspace/netvent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/netvent", "run", "build" ]
publicDir = "artifacts/netvent/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23020"
BASE_PATH = "/"
