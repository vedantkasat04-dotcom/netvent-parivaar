openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NetVent Parivaar API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: membership
    description: Membership management
  - name: members
    description: Member directory
  - name: events
    description: Events
  - name: groups
    description: Groups and feed
  - name: team
    description: Team members
  - name: cities
    description: Cities
  - name: notifications
    description: Notifications
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /v1/auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # MEMBERSHIP
  /v1/membership/apply:
    post:
      operationId: applyMembership
      tags: [membership]
      summary: Submit membership application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/membership/status:
    get:
      operationId: getMembershipStatus
      tags: [membership]
      summary: Get own application status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipStatusResponse"

  /v1/membership/me:
    patch:
      operationId: updateMyProfile
      tags: [membership]
      summary: Update own profile and privacy settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"

  # EXPERTISE LOOKUP
  /v1/expertise:
    get:
      operationId: listExpertise
      tags: [members]
      summary: List all available expertise options
      responses:
        "200":
          description: Expertise list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertiseListResponse"

  # USER PROFILE
  /v1/users/me:
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Update own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email or phone already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/me/availability:
    patch:
      operationId: setAvailability
      tags: [auth]
      summary: Update own availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  # DIRECTORY
  /v1/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: Search and list members
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: expertise
          in: query
          schema:
            type: string
        - name: available
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListResponse"

  /v1/members/{memberId}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get member profile
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryMemberResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # EVENTS
  /v1/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [UPCOMING, PAST]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"

  /v1/events/{eventId}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event detail
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/events/{eventId}/rsvp:
    post:
      operationId: rsvpEvent
      tags: [events]
      summary: RSVP to event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: RSVP status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # GROUPS
  /v1/groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List groups
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"

  /v1/groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get group detail
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"

  /v1/groups/{groupId}/posts:
    post:
      operationId: createPost
      tags: [groups]
      summary: Create a post in a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /v1/groups/{groupId}/join:
    post:
      operationId: joinGroup
      tags: [groups]
      summary: Join a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/posts:
    get:
      operationId: listPosts
      tags: [groups]
      summary: List posts (optionally filtered by groupId and type)
      parameters:
        - name: groupId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [DISCUSSION, ANNOUNCEMENT, RESOURCE]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"

  /v1/feed:
    get:
      operationId: getFeed
      tags: [groups]
      summary: Get global activity feed
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Feed posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"

  # TEAM
  /v1/team:
    get:
      operationId: listTeam
      tags: [team]
      summary: List team members
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"

  # CITIES
  /v1/cities:
    get:
      operationId: listCities
      tags: [cities]
      summary: List cities
      responses:
        "200":
          description: Cities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityListResponse"

  # SKILLS LOOKUP
  /v1/skills:
    get:
      operationId: listSkills
      tags: [members]
      summary: List all available skills
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListResponse"

  # NOTIFICATIONS
  /v1/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /v1/notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # STATS (wow endpoint)
  /v1/stats:
    get:
      operationId: getStats
      tags: [members]
      summary: Platform statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  # ADMIN
  /v1/admin/members:
    get:
      operationId: adminListMembers
      tags: [admin]
      summary: Admin list members with filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMemberListResponse"

  /v1/admin/members/{profileId}/approve:
    post:
      operationId: adminApproveMember
      tags: [admin]
      summary: Approve member application
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"

  /v1/admin/members/{profileId}/reject:
    post:
      operationId: adminRejectMember
      tags: [admin]
      summary: Reject member application
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"

  /v1/admin/members/{profileId}:
    patch:
      operationId: adminUpdateMember
      tags: [admin]
      summary: Admin update member profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
    delete:
      operationId: adminDeleteMember
      tags: [admin]
      summary: Delete member
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/admin/events:
    post:
      operationId: adminCreateEvent
      tags: [admin]
      summary: Create event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /v1/admin/events/{eventId}:
    patch:
      operationId: adminUpdateEvent
      tags: [admin]
      summary: Update event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: adminDeleteEvent
      tags: [admin]
      summary: Delete event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/admin/groups:
    post:
      operationId: adminCreateGroup
      tags: [admin]
      summary: Create group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /v1/admin/groups/{groupId}:
    patch:
      operationId: adminUpdateGroup
      tags: [admin]
      summary: Update group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      operationId: adminDeleteGroup
      tags: [admin]
      summary: Delete group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/admin/team:
    post:
      operationId: adminCreateTeamMember
      tags: [admin]
      summary: Add team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"

  /v1/admin/team/{teamMemberId}:
    patch:
      operationId: adminUpdateTeamMember
      tags: [admin]
      summary: Update team member
      parameters:
        - name: teamMemberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
    delete:
      operationId: adminDeleteTeamMember
      tags: [admin]
      summary: Delete team member
      parameters:
        - name: teamMemberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/admin/cities:
    post:
      operationId: adminCreateCity
      tags: [admin]
      summary: Create city
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"

  /v1/admin/cities/{cityId}:
    patch:
      operationId: adminUpdateCity
      tags: [admin]
      summary: Update city
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"

  /v1/admin/reports:
    get:
      operationId: adminListReports
      tags: [admin]
      summary: List reports
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, RESOLVED]
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"

  /v1/admin/reports/{reportId}/resolve:
    patch:
      operationId: adminResolveReport
      tags: [admin]
      summary: Resolve report
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /v1/admin/dashboard:
    get:
      operationId: adminGetDashboard
      tags: [admin]
      summary: Admin dashboard stats
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /v1/reports:
    post:
      operationId: createReport
      tags: [members]
      summary: Report a post or profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Reported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [success, error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    # AUTH SCHEMAS
    SignupInput:
      type: object
      required: [name, email, password, phone, city, educationType, expertiseIds]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone:
          type: string
          pattern: "^[0-9]{10}$"
        city:
          type: string
        educationType:
          type: string
          enum: [SCHOOL, COLLEGE]
        schoolOrCollegeName:
          type: ["string", "null"]
        schoolClass:
          type: ["string", "null"]
        degreeLevel:
          type: ["string", "null"]
          enum: [DIPLOMA, BACHELORS, MASTERS, null]
        collegeYear:
          type: ["string", "null"]
        expertiseIds:
          type: array
          items:
            type: string
          maxItems: 3

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        rememberMe:
          type: boolean

    UserMe:
      type: object
      required: [id, name, email, role, isAvailable]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [BASIC, MEMBER, MODERATOR, ADMIN]
        phone:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        educationType:
          type: ["string", "null"]
          enum: [SCHOOL, COLLEGE, null]
        schoolOrCollegeName:
          type: ["string", "null"]
        schoolClass:
          type: ["string", "null"]
        degreeLevel:
          type: ["string", "null"]
          enum: [DIPLOMA, BACHELORS, MASTERS, null]
        collegeYear:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isAvailable:
          type: boolean
        expertise:
          type: array
          items:
            $ref: "#/components/schemas/Expertise"
        memberProfile:
          $ref: "#/components/schemas/MemberProfile"

    AuthResponse:
      type: object
      required: [success, user]
      properties:
        success:
          type: boolean
        user:
          $ref: "#/components/schemas/UserMe"

    Expertise:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    ExpertiseListResponse:
      type: object
      required: [success, data]
      properties:
        success:
